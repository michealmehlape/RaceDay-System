name: Build and Test (API and Web)

on:
  push:
    branches: [ main, Part3 ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore RaceDay.Api/RaceDay.Api.slnx

      - name: Build the solution
        run: dotnet build RaceDay.Api/RaceDay.Api.slnx --configuration Release --no-restore

      - name: Build the MVC web app
        run: dotnet build RaceDay.Api/RaceDay.Web/RaceDay.Web.csproj --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDay.Api/RaceDay.Api.slnx --configuration Release --no-build --verbosity normal

      - name: Build the web Docker image
        run: docker build -t raceday-web RaceDay.Api/RaceDay.Web