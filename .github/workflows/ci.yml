name: Part 2 - Build and Test API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore RaceDay.Api/RaceDay.Api.slnx

      - name: Build
        run: dotnet build RaceDay.Api/RaceDay.Api.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay.Api/RaceDay.Api.slnx --configuration Release --no-build --verbosity normal