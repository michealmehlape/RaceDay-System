name: Validate Repository Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "::error::Missing required /docs folder"
            exit 1
          fi
          echo "docs/ folder found."

      - name: Check ERD file exists (PNG or PDF)
        run: |
          shopt -s nullglob
          files=(docs/*.png docs/*.pdf)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No ERD file (.png or .pdf) found in /docs"
            exit 1
          fi
          echo "ERD file found: ${files[0]}"

      - name: Check endpoint plan exists (PDF or Markdown)
        run: |
          if ! ls docs/*endpoint* 1> /dev/null 2>&1; then
            echo "::error::No endpoint plan file found in /docs (expected a filename containing 'endpoint')"
            exit 1
          fi
          echo "Endpoint plan found."

      - name: Check SQL script exists
        run: |
          if ! ls docs/*.sql 1> /dev/null 2>&1; then
            echo "::error::No .sql script found in /docs"
            exit 1
          fi
          echo "SQL script found."

      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "::error::Missing README.md in repository root"
            exit 1
          fi
          echo "README.md found."

      - name: All checks passed
        run: echo "Repository structure is valid."
